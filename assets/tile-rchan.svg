    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ping { animation: ping 2s ease-out infinite; }
    @keyframes ping { 50% { opacity: .15; } }
  </style>

  <rect x=".5" y=".5" width="449" height="213" rx="10" fill="#0b0d12" stroke="#30363d"/>
  <path d="M1 11a10 10 0 0 1 10-10h428a10 10 0 0 1 10 10v20H1z" fill="#151922"/>
  <line x1="0" y1="31" x2="450" y2="31" stroke="#30363d"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#febc2e"/>
  <circle cx="50" cy="16" r="5" fill="#28c840"/>
  <text x="66" y="20" class="mono" font-size="11" fill="#8b949e">~/rchan</text>
  <rect x="390" y="7" width="43" height="18" rx="9" fill="none" stroke="#f778ba" stroke-opacity=".65"/>
  <text x="411.5" y="20" text-anchor="middle" class="mono" font-size="10" letter-spacing="1" fill="#f778ba">LIVE</text>

  <text x="20" y="60" class="sans" font-size="14" font-weight="600" fill="#fff">rchan</text>
  <text x="19" y="96" class="sans" font-size="21" font-weight="600" fill="#fff" letter-spacing="-0.7">Imageboard</text>
  <text x="19" y="121" class="sans" font-size="21" font-weight="600" fill="#80848e" letter-spacing="-0.7">em tempo real.</text>
  <rect x="20" y="140" width="238" height="1" fill="#2a2a2d"/>

  <g class="sans">
    <text x="20" y="163" font-size="15" font-weight="600" fill="#fff">Python</text>
    <text x="20" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">3.11</text>
    <text x="96" y="163" font-size="15" font-weight="600" fill="#fff">Socket.IO</text>
    <text x="96" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">REALTIME</text>
    <text x="180" y="163" font-size="15" font-weight="600" fill="#fff">HTML</text>
    <text x="180" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">FRONTEND</text>
  </g>

  <g class="mono">
