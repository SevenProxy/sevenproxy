      <rect x="290" y="122" width="138" height="38" rx="4" fill="#1b1320" stroke="#3d2a46"/>
      <rect x="296" y="128" width="26" height="26" rx="3" fill="#2a1b33"/>
      <path d="M296 150l7-6 7 5 5-3 7 4z" fill="#f778ba" opacity=".25"/>
