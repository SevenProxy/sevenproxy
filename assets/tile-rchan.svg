    <g>
      <rect x="282" y="78" width="138" height="38" rx="4" fill="#1b1320" stroke="#3d2a46"/>
      <rect x="288" y="84" width="26" height="26" rx="3" fill="#2a1b33"/>
      <path d="M288 106l9-9 6 6 5-4 6 7z" fill="#f778ba" opacity=".35"/>
      <rect x="320" y="86" width="88" height="3" rx="1.5" fill="#484f58"/>
