<svg xmlns="http://www.w3.org/2000/svg" width="450" height="214" viewBox="0 0 450 214" role="img" aria-label="gopacket-sniffer: sniffer de pacotes em Go, inspirado no Wireshark, com captura e análise em tempo real no terminal">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .flow { animation: flow 4s linear infinite; }
    @keyframes flow { to { transform: translateX(30px); } }
  </style>

  <rect x=".5" y=".5" width="449" height="213" rx="10" fill="#0b0d12" stroke="#30363d"/>
  <path d="M1 11a10 10 0 0 1 10-10h428a10 10 0 0 1 10 10v20H1z" fill="#151922"/>
  <line x1="0" y1="31" x2="450" y2="31" stroke="#30363d"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#febc2e"/>
  <circle cx="50" cy="16" r="5" fill="#28c840"/>
  <text x="66" y="20" class="mono" font-size="11" fill="#8b949e">~/gopacket-sniffer</text>
  <rect x="393" y="7" width="40" height="18" rx="9" fill="none" stroke="#3fb950" stroke-opacity=".65"/>
  <text x="413" y="20" text-anchor="middle" class="mono" font-size="10" letter-spacing="1" fill="#3fb950">NET</text>

  <text x="20" y="60" class="sans" font-size="14" font-weight="600" fill="#fff">gopacket-sniffer</text>
  <text x="19" y="96" class="sans" font-size="21" font-weight="600" fill="#fff" letter-spacing="-0.7">Pacotes não mentem:</text>
  <text x="19" y="121" class="sans" font-size="21" font-weight="600" fill="#80848e" letter-spacing="-0.7">eu leio todos.</text>
  <rect x="20" y="140" width="238" height="1" fill="#2a2a2d"/>

  <g class="sans">
    <text x="20" y="163" font-size="15" font-weight="600" fill="#fff">TCP</text>
    <text x="20" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">STREAM</text>
    <text x="96" y="163" font-size="15" font-weight="600" fill="#fff">UDP</text>
    <text x="96" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">DATAGRAM</text>
    <text x="172" y="163" font-size="15" font-weight="600" fill="#fff">PCAP</text>
    <text x="172" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">CAPTURE</text>
  </g>

  <g class="mono">
    <rect x="272" y="50" width="158" height="132" rx="7" fill="#0d1410" stroke="#238636" stroke-opacity=".5"/>
    <text x="284" y="66" font-size="8" letter-spacing="1" fill="#7ee787">● live capture</text>
    <line x1="272" y1="73" x2="430" y2="73" stroke="#1d3023"/>
    <g class="flow" fill="#3fb950">
      <rect x="278" y="88" width="18" height="7" rx="2" opacity=".35"/>
      <rect x="302" y="88" width="18" height="7" rx="2" opacity=".55"/>
      <rect x="326" y="88" width="18" height="7" rx="2" opacity=".75"/>
      <rect x="350" y="88" width="18" height="7" rx="2"/>
      <rect x="374" y="88" width="18" height="7" rx="2" opacity=".8"/>
      <rect x="398" y="88" width="18" height="7" rx="2" opacity=".5"/>
    </g>
    <path d="M282 112 H420 M282 124 H398 M282 136 H412" stroke="#2ea043" stroke-opacity=".4" stroke-width="1"/>
    <text x="284" y="108" font-size="8.5" fill="#8b949e">192.168.1.24 → 443</text>
    <text x="284" y="133" font-size="8.5" fill="#8b949e">len=98  proto=TCP</text>
    <text x="284" y="169" font-size="8.5" fill="#7ee787">$ sniff --iface wlan0</text>
  </g>
</svg>
