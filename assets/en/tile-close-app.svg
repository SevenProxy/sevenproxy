<svg xmlns="http://www.w3.org/2000/svg" width="450" height="214" viewBox="0 0 450 214" role="img" aria-label="close_app: Rust GUI to find processes and terminate them with SIGTERM">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .blink { animation: blink 1.8s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
  </style>

  <rect x=".5" y=".5" width="449" height="213" rx="10" fill="#0b0d12" stroke="#30363d"/>
  <path d="M1 11a10 10 0 0 1 10-10h428a10 10 0 0 1 10 10v20H1z" fill="#151922"/>
  <line x1="0" y1="31" x2="450" y2="31" stroke="#30363d"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#febc2e"/>
  <circle cx="50" cy="16" r="5" fill="#28c840"/>
  <text x="66" y="20" class="mono" font-size="11" fill="#8b949e">~/close_app</text>
  <rect x="389" y="7" width="44" height="18" rx="9" fill="none" stroke="#f0883e" stroke-opacity=".65"/>
  <text x="411" y="20" text-anchor="middle" class="mono" font-size="10" letter-spacing="1" fill="#f0883e">RUST</text>

  <text x="20" y="60" class="sans" font-size="14" font-weight="600" fill="#fff">close_app</text>
  <text x="19" y="96" class="sans" font-size="21" font-weight="600" fill="#fff" letter-spacing="-0.7">Process vanished?</text>
  <text x="19" y="121" class="sans" font-size="21" font-weight="600" fill="#80848e" letter-spacing="-0.7">Send SIGTERM.</text>
  <rect x="20" y="140" width="238" height="1" fill="#2a2a2d"/>

  <g class="sans">
    <text x="20" y="163" font-size="15" font-weight="600" fill="#fff">PID</text>
    <text x="20" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">TARGET</text>
    <text x="96" y="163" font-size="15" font-weight="600" fill="#fff">SIGTERM</text>
    <text x="96" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">ACTION</text>
    <text x="184" y="163" font-size="15" font-weight="600" fill="#fff">GUI</text>
    <text x="184" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">HYPRLAND</text>
  </g>

  <g class="mono">
    <rect x="274" y="52" width="156" height="130" rx="7" fill="#10141c" stroke="#30363d"/>
    <text x="286" y="68" font-size="8" letter-spacing="1" fill="#8b949e">PROCESSES</text>
    <line x1="274" y1="74" x2="430" y2="74" stroke="#21262d"/>
    <g font-size="8.5">
      <rect x="284" y="84" width="9" height="9" rx="2" fill="none" stroke="#f0883e"/>
      <text x="300" y="92" fill="#e6edf3">vesktop</text>
      <text x="408" y="92" fill="#484f58">4381</text>
      <rect x="284" y="106" width="9" height="9" rx="2" fill="#a371f7"/>
      <path d="M286 110.5l2 2 3.5-4" fill="none" stroke="#0b0d12" stroke-width="1.3"/>
      <text x="300" y="114" fill="#8b949e">hyprland</text>
      <text x="408" y="114" fill="#484f58">1024</text>
      <rect x="284" y="128" width="9" height="9" rx="2" fill="none" stroke="#30363d"/>
      <text x="300" y="136" fill="#8b949e">waybar</text>
      <text x="408" y="136" fill="#484f58">1180</text>
    </g>
    <rect x="284" y="150" width="132" height="21" rx="5" fill="#2a160f" stroke="#f0883e" stroke-opacity=".6"/>
    <text class="blink" x="350" y="164" text-anchor="middle" font-size="9" letter-spacing="1" fill="#ffa657">kill -TERM 4381 ↵</text>
  </g>
</svg>
