<svg xmlns="http://www.w3.org/2000/svg" width="450" height="214" viewBox="0 0 450 214" role="img" aria-label="Tesseract: portfolio feito com Rust, WebAssembly e Tailwind CSS">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .spin { transform-origin: 351px 119px; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <rect x=".5" y=".5" width="449" height="213" rx="10" fill="#0b0d12" stroke="#30363d"/>
  <path d="M1 11a10 10 0 0 1 10-10h428a10 10 0 0 1 10 10v20H1z" fill="#151922"/>
  <line x1="0" y1="31" x2="450" y2="31" stroke="#30363d"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#febc2e"/>
  <circle cx="50" cy="16" r="5" fill="#28c840"/>
  <text x="66" y="20" class="mono" font-size="11" fill="#8b949e">~/tesseract</text>
  <rect x="385" y="7" width="48" height="18" rx="9" fill="none" stroke="#79c0ff" stroke-opacity=".65"/>
  <text x="409" y="20" text-anchor="middle" class="mono" font-size="10" letter-spacing="1" fill="#79c0ff">WASM</text>

  <text x="20" y="60" class="sans" font-size="14" font-weight="600" fill="#fff">Tesseract</text>
  <text x="19" y="96" class="sans" font-size="21" font-weight="600" fill="#fff" letter-spacing="-0.7">Meu portfolio,</text>
  <text x="19" y="121" class="sans" font-size="21" font-weight="600" fill="#80848e" letter-spacing="-0.7">em Rust + WASM.</text>
  <rect x="20" y="140" width="238" height="1" fill="#2a2a2d"/>

  <g class="sans">
    <text x="20" y="163" font-size="15" font-weight="600" fill="#fff">Rust</text>
    <text x="20" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">CORE</text>
    <text x="96" y="163" font-size="15" font-weight="600" fill="#fff">WASM</text>
    <text x="96" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">BUILD</text>
    <text x="172" y="163" font-size="15" font-weight="600" fill="#fff">Tailwind</text>
    <text x="172" y="178" font-size="7" letter-spacing="1.1" fill="#80848e">STYLE</text>
  </g>

  <g class="spin" fill="none" stroke-linejoin="round">
